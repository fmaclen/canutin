name: Tests

on:
  pull_request:

# A new push supersedes the run already in flight. The desktop and mobile suites are too
# expensive to leave running against a commit nobody is waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: pocketbase/go.sum

      - name: Run Go tests
        working-directory: pocketbase
        run: |
          go vet ./...
          go test ./...

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # setup-bun caches the Bun binary, not the packages it downloads.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # On a hit, `playwright install` finds both browsers already present and only the
      # system dependencies are installed.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        # xvfb-run provides the virtual display WebKit needs to run headed on Linux CI;
        # headless WebKit crashes here (EGL_NOT_INITIALIZED at page.goto). See playwright.config.ts.
        run: xvfb-run -a bun run test
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() # Upload results even if tests fail
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 2

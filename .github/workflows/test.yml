name: Tests

on:
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: pocketbase/go.sum

      - name: Run Go tests
        working-directory: pocketbase
        run: |
          go vet ./...
          go test ./...

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        # xvfb-run provides the virtual display WebKit needs to run headed on Linux CI;
        # headless WebKit crashes here (EGL_NOT_INITIALIZED at page.goto). See playwright.config.ts.
        run: xvfb-run -a bun run test
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() # Upload results even if tests fail
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 2
